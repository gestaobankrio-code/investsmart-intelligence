name: Autoformat Production Branch

on:
  push:
    branches:
      - prod/ux-hardening-2026-11-19

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: aplica Prettier')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prod/ux-hardening-2026-11-19

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format application code
        run: |
          bunx prettier --write "src/**/*.{ts,tsx,css}" "vite.config.ts" "vitest.config.ts" "eslint.config.js"

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de formatação."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src vite.config.ts vitest.config.ts eslint.config.js
          git commit -m "style: aplica Prettier no projeto"
          git push origin HEAD:prod/ux-hardening-2026-11-19
