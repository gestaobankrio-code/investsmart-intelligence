name: Formatar nova experiência financeira
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-finance-redesign.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prettier nos componentes da nova experiência
        run: bunx prettier --write src/lib/regional-insights.ts src/hooks/useRegionalFeed.ts src/components/RegionalInsightsUI.tsx src/components/FinancialTermsPage.tsx src/components/CompareStatesPage.tsx src/styles/finance-pages.css src/routes/index.tsx src/test/regional-insights.test.ts
      - name: Publicar formatação
        run: |
          git add src/lib/regional-insights.ts src/hooks/useRegionalFeed.ts src/components/RegionalInsightsUI.tsx src/components/FinancialTermsPage.tsx src/components/CompareStatesPage.tsx src/styles/finance-pages.css src/routes/index.tsx src/test/regional-insights.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: padronizar layouts e componentes da análise financeira por UF"
          git restore --worktree .
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
