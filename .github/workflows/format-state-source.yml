name: Formatar correção da fonte estadual
on:
  push:
    branches: [main]
    paths: [".github/workflows/format-state-source.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Normalizar Prettier dos arquivos estaduais
        run: bunx prettier --write src/components/StateRadar.tsx src/lib/state-trends.ts src/test/state-trends.test.ts
      - name: Salvar formatação sem sobrescrever terceiros
        run: |
          git add src/components/StateRadar.tsx src/lib/state-trends.ts src/test/state-trends.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: formatar integração da nova coleta financeira estadual"
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
