name: Formatar correção regional
on:
  push:
    branches: [main]
    paths: [".github/workflows/format-regional.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Aplicar Prettier aos arquivos alterados
        run: bunx prettier --write src/components/AppSplash.tsx src/components/RealTrends.tsx src/lib/trends-feed.ts src/test/trends-feed.test.ts
      - name: Publicar formatação sem sobrescrever alterações externas
        run: |
          if git diff --quiet -- src/components/AppSplash.tsx src/components/RealTrends.tsx src/lib/trends-feed.ts src/test/trends-feed.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppSplash.tsx src/components/RealTrends.tsx src/lib/trends-feed.ts src/test/trends-feed.test.ts
          git commit -m "style: formatar diferenciais regionais e splash estendido"
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
