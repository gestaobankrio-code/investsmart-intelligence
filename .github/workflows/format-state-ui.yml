name: Formatar novos componentes estaduais
# Execução temporária de revisão visual e de qualidade.
on:
  push:
    branches: [main]
    paths: [".github/workflows/format-state-ui.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar Prettier nos arquivos estaduais
        run: bunx prettier --write src/components/StateRadar.tsx src/lib/state-trends.ts src/routes/index.tsx src/test/state-trends.test.ts
      - name: Salvar somente a formatação
        run: |
          git add src/components/StateRadar.tsx src/lib/state-trends.ts src/routes/index.tsx src/test/state-trends.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: padronizar interface de tendências realmente estaduais"
          git restore --worktree .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
